[package]
name = "flydigictl"
version = "0.1.1"
edition = "2021"
description = "Control Flydigi BS series laptop coolers on Linux"
repository = "https://github.com/ElXreno/flydigictl"
license = "MIT"

[features]
# The GUI drags in wgpu and a windowing stack, which has no business in a
# headless install, so the daemon and the CLI stay buildable without it.
gui = ["dep:iced"]

[dependencies]
argh = "0.1"
# Only `canvas` on top of the defaults. Notably not `tokio`: it was here for a
# timer this no longer has, and its runtime alone was a third of the binary.
iced = { version = "0.14", features = ["canvas"], optional = true }
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
nix = { version = "0.29", default-features = false, features = [
  "poll",
  "mman",
  # sysconf, for the page size the mapping has to be aligned to
  "feature",
] }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[lib]
name = "flydigictl"
path = "src/lib.rs"

[[bin]]
name = "flydigictl"
path = "src/main.rs"

[[bin]]
name = "flydigictld"
path = "src/bin/flydigictld.rs"

[[bin]]
name = "flydigictl-gui"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

# Full debug info on a wgpu-sized dependency tree buys a 400 MB binary and the
# link time to match. Line tables keep backtraces readable, which is all this
# has ever needed.
# Nothing here ships symbols: crane leaves them in, and they are a third of
# what lands in the store.
[profile.release]
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
