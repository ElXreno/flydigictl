[package]
name = "flydigictl"
version = "0.1.0"
edition = "2021"
description = "Control Flydigi BS series laptop coolers on Linux"
repository = "https://github.com/ElXreno/flydigictl"
license = "MIT"

[dependencies]
argh = "0.1"
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
nix = { version = "0.29", default-features = false, features = ["poll"] }
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[lib]
name = "flydigictl"
path = "src/lib.rs"

[[bin]]
name = "flydigictl"
path = "src/main.rs"

[[bin]]
name = "flydigictld"
path = "src/bin/flydigictld.rs"
